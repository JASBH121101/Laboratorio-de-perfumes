name: Foundation quality

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  foundation:
    name: Foundation tests and structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run unit tests
        run: npm test
      - name: Check browser module syntax
        run: |
          node --check src/js/app.js
          node --check src/js/ui/views.js
          node --check src/js/core/navigation.js
          node --check src/js/core/pwa.js
          node --check src/js/features/perfume-library/data.js
          node --check src/js/features/perfume-library/library.js
          node --check src/js/features/laboratory/mixing/state.js
          node --check src/js/features/laboratory/mixing/draft-storage.js
          node --check src/js/features/laboratory/mixing/panel.js
          node --check src/js/features/laboratory/creative-assistant/engine.js
          node --check src/js/features/laboratory/creative-assistant/panel.js
          node --check src/js/features/laboratory/formulation-proposals/engine.js
          node --check src/js/features/laboratory/formulation-proposals/panel.js
          node --check src/js/features/laboratory/inspiration-differentiation/engine.js
          node --check src/js/features/laboratory/inspiration-differentiation/panel.js
          node --check src/js/features/laboratory/client-brief/engine.js
          node --check src/js/features/laboratory/client-brief/panel.js
          node --check src/js/features/laboratory/audience-fit/engine.js
          node --check src/js/features/laboratory/audience-fit/panel.js
          node --check src/js/features/laboratory/reference-benchmark/data.js
          node --check src/js/features/laboratory/reference-benchmark/engine.js
          node --check src/js/features/laboratory/reference-benchmark/panel.js
          node --check src/js/features/laboratory/fragrance-similarity/contracts.js
          node --check src/js/features/laboratory/fragrance-similarity/model.js
          node --check src/js/features/laboratory/fragrance-similarity/normalization.js
          node --check src/js/features/laboratory/fragrance-similarity/comparison.js
          node --check src/js/features/laboratory/fragrance-similarity/scoring.js
          node --check src/js/features/laboratory/fragrance-similarity/explanation.js
          node --check src/js/features/laboratory/fragrance-similarity/search.js
          node --check src/js/features/laboratory/fragrance-similarity/ranking.js
          node --check src/js/features/laboratory/performance-estimator/engine.js
          node --check src/js/features/laboratory/performance-estimator/panel.js
          node --check src/js/features/laboratory/analysis/engine.js
          node --check src/js/features/laboratory/analysis/panel.js
          node --check src/js/features/laboratory/analytics/dashboard.js
          node --check src/js/features/laboratory/originality/engine.js
          node --check src/js/features/laboratory/originality/panel.js
          node --check src/js/features/laboratory/comparison/engine.js
          node --check src/js/features/laboratory/comparison/panel.js
          node --check src/js/features/laboratory/signature-history/engine.js
          node --check src/js/features/laboratory/signature-history/panel.js
          node --check src/js/features/laboratory/sensory-experiments/model.js
          node --check src/js/features/laboratory/sensory-experiments/panel.js
          node --check src/js/features/laboratory/professional-reports/engine.js
          node --check src/js/features/laboratory/professional-reports/panel.js
          node --check src/js/features/archive/repository.js
          node --check src/js/features/laboratory/evolution/engine.js
          node --check src/js/features/laboratory/evolution/panel.js
          node --check src/js/features/archive/model.js
          node --check src/js/features/archive/repository.js
          node --check src/js/features/archive/panel.js
          node --check sw.js
      - name: Validate PWA and application structure
        run: npm run validate
