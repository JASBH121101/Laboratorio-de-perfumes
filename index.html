<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#171216">
  <meta name="description" content="JB Perfume Lab: espacio digital para formulación conceptual, analítica olfativa y desarrollo de identidad creativa.">
  <meta name="color-scheme" content="dark light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="./assets/brand-logo.svg" type="image/svg+xml">
  <link rel="icon" href="./assets/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="./assets/icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./src/css/styles.css">
  <link rel="stylesheet" href="./src/css/design-system.css">
  <link rel="stylesheet" href="./src/css/perfume-library.css">
  <link rel="stylesheet" href="./src/css/laboratory.css">\n  <link rel="stylesheet" href="./src/css/analytics.css">
  <title>JB Perfume Lab — Formulación y analítica</title>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="boot-screen"><img class="brand-logo" src="./assets/brand-logo.svg" alt="Perfumería JB"><p>Preparando JB Perfume Lab…</p></div>
  </div>
  <aside class="app-notice" id="app-notice" hidden role="status" aria-live="polite" aria-atomic="true">
    <div class="notice-copy">
      <strong id="app-notice-title">JB Atelier</strong>
      <p id="app-notice-message"></p>
    </div>
    <div class="notice-actions">
      <button class="button button--notice" id="app-notice-action" type="button" data-action="apply-update" hidden>Actualizar</button>
      <button class="notice-dismiss" type="button" data-action="dismiss-notice" aria-label="Cerrar aviso">×</button>
    </div>
  </aside>
  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
